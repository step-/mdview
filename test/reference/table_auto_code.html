<p><span fgcolor="red">Limitation: mdview does not apply auto-code spans inside table cells.</span></p>
<table>
<thead>
<tr>
<th align="left"></th>
<th align="center">😎</th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">?auto-code span? =&gt;</td>
<td align="center">/auto/code/1</td>
</tr>
<tr>
<td align="left">?auto-code span? =&gt;</td>
<td align="center">#abc</td>
</tr>
</tbody>
</table>
<hr />
<p>Auto-code spans look like this: <code>/auto/code/1</code>, <code>#abc</code>.</p>
